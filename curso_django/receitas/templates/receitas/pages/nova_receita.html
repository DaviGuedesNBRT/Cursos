{% extends "base.html" %}
{%load static%}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/nova_receita.css' %}">
{% endblock %}

{%block content %}
<div class="container">
    <div class="conteudo">
        <h1>Nova Receita</h1>
        <form method="post" enctype="multipart/form-data">
            <label for="titulo">Titulo :</label>
            <input type="text" name="titulo">

            <label for="nome">Nome :</label>
            <input type="text" name="nome">

            <label for="descricao">Descrição :</label>
            <textarea name="descricao"></textarea>

            <label for="ingredientes">Ingredientes :</label>
            <textarea name="ingredientes"></textarea>

            <label for="modo_preparo">Modo de Preparo :</label>
            <textarea name="modo_preparo"></textarea>

            <label for="rendimento">Rendimento :</label>
            <input type="text" name="rendimento">

            <label for="tempo_preparo">Tempo de Preparo :</label>
            <input type="text" name="tempo_preparo">

            <label for="categoria">Categoria :</label>
            <select name="categoria">
                {% for categoria in categorias %}
                    <option value="{{ categoria.cat_id }}">{{ categoria.cat_nome }}</option>
                {% endfor %}
            </select>

            <label for="imagem">Imagem :</label>
            <input type="file" name="imagem">

            <button type="submit">Salvar Receita</button>
        </form>
    </div>
</div>
{% endblock %}
